# SearXNG settings for MCP tool integration
use_default_settings: true

general:
  instance_name: "SearXNG Local"
  debug: false

server:
  secret_key: ""
  bind_address: "0.0.0.0:8080"
  base_url: "http://localhost:8888/"
  limiter: false
  image_proxy: true
  method: "GET"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  default_lang: "en"

valkey:
  url: valkey://valkey:6379/0

ui:
  static_use_hash: true
  default_locale: "en"

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: stackoverflow
    engine: stackexchange
    shortcut: so
    categories: it
    search_site: stackoverflow.com
    disabled: false

  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false

  - name: google scholar
    engine: google_scholar
    shortcut: gs
    disabled: false
